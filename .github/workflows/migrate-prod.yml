name: migrate prod

# Runs only after `ci` succeeds for a push to main; `workflow_run` workflows load from main.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Never run two migrations at once or cancel one midway.
concurrency:
  group: migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    name: migrate prod
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - name: Checkout the commit that passed ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
      # Migrations must stay additive: old code keeps serving until Vercel promotes the new build.
      - name: Apply schema and auth migrations to production
        run: node --import tsx scripts/setup.ts
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}

  # The worker deploys only after its migrations apply, from the same commit. A separate
  # workflow_run workflow would see main's latest head instead, which may not be migrated yet.
  deploy-worker:
    name: deploy worker
    needs: migrate
    runs-on: ubuntu-latest
    # The drain waits for a review in flight, at most about 12 minutes.
    timeout-minutes: 40
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HUSKY: 0
    steps:
      - name: Checkout the commit that passed ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # Building first keeps the time with no worker to the drain plus the machine's restart.
      - name: Build and push the worker image
        run: flyctl deploy --build-only --push --remote-only --image-label "$HEAD_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PROD }}
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
      - name: Drain the running worker
        run: node --import tsx scripts/drain-worker.ts https://ctf-monitor-worker.fly.dev
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      - name: Release the built image
        run: flyctl deploy --ha=false --image "registry.fly.io/ctf-monitor-worker:$HEAD_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PROD }}
