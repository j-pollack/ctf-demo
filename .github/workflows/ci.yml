name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare disposable Postgres image
        run: docker pull postgres:18-alpine
      - name: Build corpus test image
        run: docker build -t ctf-flag-read-sprite:1 evals/flag-read
      - name: Check lint, formatting, types, and offline tests
        run: npm run check
      - name: Run Postgres integration tests
        run: npm run test:integration
      - name: Build production bundle
        run: npm run build
        env:
          DATABASE_URL_UNPOOLED: postgresql://unavailable:unavailable@127.0.0.1:1/ctf
          BETTER_AUTH_SECRET: ci-dummy-auth-secret-not-for-real-use-000000
          BETTER_AUTH_URL: http://localhost:3000
          CRON_SECRET: ci-dummy-cron-secret-not-for-real-use-000000
          OPENROUTER_API_KEY: ci-dummy-provider-key
          SPRITE_TOKEN: ci-dummy-sprite-token
          RESEND_API_KEY: ci-dummy-resend-key
          RESEND_FROM: ci@example.invalid
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare disposable Postgres image
        run: docker pull postgres:18-alpine
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: .artifacts/e2e/
          if-no-files-found: ignore
