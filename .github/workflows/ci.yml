name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Tripwire CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: docker pull postgres:17-alpine
      - run: npm run check
      - run: npm run test:integration
      - run: npm run build
        env:
          DATABASE_URL_UNPOOLED: postgresql://unavailable:unavailable@127.0.0.1:1/ctf
          BETTER_AUTH_SECRET: ci-dummy-auth-secret-not-for-real-use-000000
          BETTER_AUTH_URL: http://localhost:3000
          CRON_SECRET: ci-dummy-cron-secret-not-for-real-use-000000
          OPENROUTER_API_KEY: ci-dummy-provider-key
          SPRITE_TOKEN: ci-dummy-sprite-token
          RESEND_API_KEY: ci-dummy-resend-key
          RESEND_FROM: ci@example.invalid
